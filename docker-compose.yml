services:

  db_dev:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    # set shared memory limit when using docker-compose
    shm_size: 128mb
    volumes:
      - dev_data:/var/lib/postgresql/data
      - .:/tmp
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: tt_migration
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    networks:
      - tt-database-network

  db_qa:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    # set shared memory limit when using docker-compose
    shm_size: 128mb
    volumes:
      - qa_data:/var/lib/postgresql/data
      - .:/tmp
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: tt_migration
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    networks:
      - tt-database-network

  db_prod:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    # set shared memory limit when using docker-compose
    shm_size: 128mb
    volumes:
      - prod_data:/var/lib/postgresql/data
      - .:/tmp
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: tt_migration
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    networks:
      - tt-database-network

  redis:
    image: "redis:7.2"
    command: [ "redis-server","--appendonly","yes","--appendfsync","everysec" ]
    volumes:
      - /var/lib/yourapp/redis:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD","redis-cli","ping" ]
      interval: 10s
      timeout: 3s
      retries: 20
    ports:
      - "6379:6379"
    networks:
      - tt-database-network

  db-proxy:
    image: haproxy:2.9-alpine
    container_name: db-proxy
    restart: always
    ports:
      - "5432:5432"
    command: ["haproxy", "-f", "/usr/local/etc/haproxy/haproxy.cfg", "-f", "/usr/local/etc/haproxy/haproxy-frontend.cfg"]
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./haproxy/haproxy-frontend.cfg:/usr/local/etc/haproxy/haproxy-frontend.cfg:ro
      - ./get_current_env.sh:/tmp/get_current_env.sh:ro
    networks:
      - tt-database-network
    depends_on:
      - db_dev
      - db_qa
      - db_prod

volumes:
  dev_data:
  qa_data:
  prod_data:

networks:
  tt-database-network:
    